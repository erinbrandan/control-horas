<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Horas - Informe Mensual</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .informe-container {
      width: 100%;
      max-width: 550px;
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .share-btn {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .share-btn:hover { background: rgba(0, 230, 118, 0.25); }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-header h2 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text);
      text-transform: capitalize;
    }

    .month-nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    .month-nav-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .report-card-body {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .report-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .report-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .report-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .report-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .report-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
    }

    .report-total-box {
      margin-top: 20px;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid var(--green);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .report-total-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .report-total-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--green);
    }

    /* ESTILOS ESPECIALES PARA EXPORTAR A PDF / IMPRESIÓN */
    @media print {
      body { background: white !important; color: black !important; }
      .top-actions, .month-nav-btn, .share-btn { display: none !important; }
      .informe-container { border: none; box-shadow: none; max-width: 100%; padding: 0; background: white !important; }
      .report-card-body { background: #f9f9f9 !important; border: 1px solid #ddd; }
      .report-value { color: #000 !important; }
      .report-total-box { background: #e8f5e9 !important; border-color: #4caf50; }
      .report-total-value { color: #2e7d32 !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="informe-container">

    <!-- Botones superiores: Volver y Compartir / PDF -->
    <div class="top-actions">
      <button id="btnVolver" class="nav-btn">⬅ Volver</button>
      <button id="btnCompartir" class="share-btn">📤 Compartir / PDF</button>
    </div>

    <!-- Cabecera de Mes con Flechas -->
    <div class="month-header">
      <button id="btnPrevMonth" class="month-nav-btn">◀</button>
      <h2 id="monthTitle">Cargando mes...</h2>
      <button id="btnNextMonth" class="month-nav-btn">▶</button>
    </div>

    <!-- Cuerpo del Informe -->
    <div class="report-card-body">

      <div class="report-row" style="grid-template-columns: 1fr;">
        <div class="report-item">
          <span class="report-label">Trabajador</span>
          <span id="repTrabajador" class="report-value">Cargando...</span>
        </div>
      </div>

      <div class="report-row">
        <div class="report-item">
          <span class="report-label">Días de buceo</span>
          <span id="repDiasBuceo" class="report-value">0</span>
        </div>
        <div class="report-item">
          <span class="report-label">Dinero buceo</span>
          <span id="repDineroBuceo" class="report-value">0 €</span>
        </div>
      </div>

      <div class="report-row" style="grid-template-columns: 1fr;">
        <div class="report-item">
          <span class="report-label">Días trabajados</span>
          <span id="repDiasTrabajados" class="report-value">0</span>
        </div>
      </div>

      <div class="report-row">
        <div class="report-item">
          <span class="report-label">Total horas (Base)</span>
          <span id="repTotalHoras" class="report-value">0.0 h</span>
        </div>
        <div class="report-item">
          <span class="report-label">Dinero horas lab.</span>
          <span id="repDineroHoras" class="report-value">0 €</span>
        </div>
      </div>

      <div class="report-row">
        <div class="report-item">
          <span class="report-label">Total horas extra</span>
          <span id="repTotalHorasExtra" class="report-value">0.0 h</span>
        </div>
        <div class="report-item">
          <span class="report-label">Dinero horas extra</span>
          <span id="repDineroExtra" class="report-value">0 €</span>
        </div>
      </div>

    </div>

    <!-- Total general del mes -->
    <div class="report-total-box">
      <div class="report-total-label">Total Dinero Mensual</div>
      <div id="repTotalDinero" class="report-total-value">0 €</div>
    </div>

  </div>
</div>

<script type="module" src="js/informe.js"></script>
</body>
</html>
