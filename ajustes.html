<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Horas - Ajustes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
  <div class="card fichar-card" style="max-height: 90vh; overflow-y: auto;">

    <!-- Botón de retorno -->
    <div class="top-nav">
      <button id="btnVolver" class="nav-btn">⬅ Volver al Fichaje</button>
    </div>

    <h2>⚙️ Ajustes y Tarifas</h2>

    <form id="ajustesForm" style="margin-top: 20px;">

      <!-- Correo Electrónico (No modificable) -->
      <div class="form-group">
        <label for="inputEmail">Correo Electrónico</label>
        <input type="email" id="inputEmail" disabled />
      </div>

      <!-- Nombre y Apellidos unificado -->
      <div class="form-group">
        <label for="inputNombre">Nombre y Apellidos</label>
        <input type="text" id="inputNombre" required placeholder="Tu nombre y apellidos" />
      </div>

      <!-- Selector de Empresa (Idéntico al registro) -->
      <div class="form-group">
        <label>Empresa</label>
        <select id="ajustesCompanySelect" required>
          <option value="">Cargando empresas...</option>
          <option value="nueva">➕ Añadir nueva empresa...</option>
        </select>
      </div>

      <!-- Input oculto para nueva empresa -->
      <div class="form-group hidden" id="ajustesNewCompanyGroup">
        <label>Nombre de la nueva empresa</label>
        <input type="text" id="ajustesNewCompanyName" placeholder="Ej. Dorna Sports / Circuit...">
      </div>

      <!-- Tarifas y Horas -->
      <div class="form-group">
        <label for="inputPrecioHora">Precio por hora (€)</label>
        <input type="number" step="0.01" id="inputPrecioHora" placeholder="15.83" />
      </div>

      <div class="form-group">
        <label for="inputPrecioHoraExtra">Precio por hora extra (€)</label>
        <input type="number" step="0.01" id="inputPrecioHoraExtra" placeholder="15.83" />
      </div>

      <div class="form-group">
        <label for="inputBaseHoras">Base de horas diarias</label>
        <input type="number" id="inputBaseHoras" placeholder="6" />
      </div>

      <div class="form-group">
        <label for="inputPrecioBuceo">Precio Plus Buceo (€)</label>
        <input type="number" step="0.01" id="inputPrecioBuceo" placeholder="30" />
      </div>
      <!-- Sección de Código de Vinculación para Empresario -->
      <div class="ajustes-card" style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
        <h3 style="font-size: 1rem; margin-bottom: 8px; color: var(--text);">🔗 Código para Empresario</h3>
        <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 12px;">
          Comparte este código con tu empresario para que pueda consultar tus informes de horas.
        </p>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="text" id="inputCodigoVinculacion" readonly value="Generando..." style="flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 1rem; text-align: center;" />
          <button id="btnCopiarCodigo" style="background: #00e676; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">Copiar</button>
        </div>
      </div>

      <button type="submit" class="btn-main" style="margin-top: 20px;">
        Guardar Cambios
      </button>
    </form>

  </div>
</div>

<script type="module" src="js/ajustes.js"></script>
</body>
</html>
